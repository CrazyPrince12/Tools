<!doctype html>
<html lang="fr" data-theme="deep">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Venice — Connexion</title>
  <meta name="description" content="Connectez-vous à Venice pour discuter sans risque de censure." />
  <link rel="icon" href="/assets/venice.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/style.css?v=20260923" />
  <style>
    .auth-page {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      position: relative;
      z-index: 10;
    }

    .auth-card {
      width: 100%;
      max-width: 420px;
      padding: 32px 28px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: color-mix(in srgb, var(--surface-solid) 85%, transparent);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 24px 60px rgba(0, 14, 26, 0.65);
    }

    .auth-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .auth-logo {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 25%, var(--bg-3), var(--bg));
      border: 1px solid var(--border-strong);
      box-shadow: 0 0 25px color-mix(in srgb, var(--aqua) 25%, transparent);
      margin-bottom: 12px;
    }

    .auth-logo svg {
      width: 42px;
      height: 42px;
    }

    .auth-title {
      font-size: 1.45rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin: 0 0 6px;
      background: linear-gradient(100deg, var(--foam), var(--aqua) 45%, var(--blue));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .auth-sub {
      font-size: 0.86rem;
      color: var(--muted);
      margin: 0;
    }

    .auth-form {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-label {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text);
    }

    .form-input {
      width: 100%;
      padding: 11px 14px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      font-family: inherit;
      font-size: 0.92rem;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
      box-sizing: border-box;
    }

    .form-input:focus {
      outline: none;
      border-color: var(--aqua);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--aqua) 25%, transparent);
    }

    .form-input::placeholder {
      color: color-mix(in srgb, var(--muted) 60%, transparent);
    }

    .auth-btn {
      width: 100%;
      padding: 12px;
      margin-top: 8px;
      border-radius: 999px;
      border: none;
      background: linear-gradient(135deg, var(--aqua), var(--blue));
      color: #04121f;
      font-weight: 700;
      font-size: 0.94rem;
      cursor: pointer;
      transition: transform 0.15s ease, filter 0.15s ease, box-shadow 0.15s ease;
      box-shadow: 0 6px 20px color-mix(in srgb, var(--aqua) 30%, transparent);
    }

    .auth-btn:hover {
      filter: brightness(1.1);
      transform: translateY(-1px);
    }

    .auth-btn:active {
      transform: translateY(0);
    }

    .auth-footer {
      margin-top: 22px;
      text-align: center;
      font-size: 0.84rem;
      color: var(--muted);
    }

    .auth-link {
      color: var(--aqua);
      text-decoration: underline;
      text-underline-offset: 3px;
      font-weight: 600;
      cursor: pointer;
    }

    .auth-error {
      padding: 10px 14px;
      border-radius: 10px;
      background: color-mix(in srgb, var(--err) 16%, transparent);
      border: 1px solid color-mix(in srgb, var(--err) 40%, transparent);
      color: var(--err);
      font-size: 0.82rem;
      display: none;
      margin-bottom: 14px;
    }

    .back-home {
      margin-top: 20px;
      color: var(--muted);
      text-decoration: none;
      font-size: 0.82rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: color 0.15s;
    }

    .back-home:hover {
      color: var(--aqua);
    }
  </style>
</head>
<body>
  <!-- Décor océan animé -->
  <div class="ocean" aria-hidden="true">
    <div class="ocean-glow"></div>
    <svg class="ocean-waves" viewBox="0 0 1440 320" preserveAspectRatio="none">
      <path class="wave wave-1" d="M0,192 C240,120 480,264 720,192 C960,120 1200,264 1440,192 L1440,320 L0,320 Z"></path>
      <path class="wave wave-2" d="M0,224 C240,160 480,288 720,224 C960,160 1200,288 1440,224 L1440,320 L0,320 Z"></path>
      <path class="wave wave-3" d="M0,256 C240,208 480,304 720,256 C960,208 1200,304 1440,256 L1440,320 L0,320 Z"></path>
    </svg>
    <div class="bubbles" id="bubbles"></div>
  </div>

  <main class="auth-page">
    <div class="auth-card">
      <div class="auth-header">
        <a href="/" class="auth-logo" title="Retour à Venice">
          <svg viewBox="0 0 128 128">
            <defs>
              <linearGradient id="skin-auth" x1="0" y1="0" x2="0.9" y2="1">
                <stop offset="0%" stop-color="#8ff7ea"/>
                <stop offset="45%" stop-color="#35e0d4"/>
                <stop offset="100%" stop-color="#2a8fe0"/>
              </linearGradient>
            </defs>
            <path fill="url(#skin-auth)" d="M124,63 C117,60 111,59 105,59 C99,46 91,40 79,40 C69,40 60,43 54,47 C53,39 49,32 43,28 C45,36 43,43 37,49 C35,51 33,52 32,54 C27,47 20,42 10,38 C18,48 25,55 30,64 C25,72 18,79 10,86 C20,80 27,74 34,70 C42,76 50,79 58,79 C66,79 72,78 76,76 C74,85 69,92 61,98 C71,92 77,85 81,75 C89,73 94,71 99,69 C105,67 111,65 116,64 C120,63 122,63 124,63 Z"/>
            <circle cx="97" cy="57" r="3.4" fill="#04222f"/>
          </svg>
        </a>
        <h1 class="auth-title">Connexion à Venice</h1>
        <p class="auth-sub">Entrez vos identifiants pour continuer</p>
      </div>

      <div id="authError" class="auth-error"></div>

      <form id="loginForm" class="auth-form" autocomplete="on">
        <div class="form-group">
          <label class="form-label" for="identifier">E-mail ou nom d'utilisateur</label>
          <input
            id="identifier"
            name="identifier"
            class="form-input"
            type="text"
            required
            placeholder="Ex : user_name ou mon@email.com"
            autocomplete="username"
            autofocus
          />
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Mot de passe</label>
          <input
            id="password"
            name="password"
            class="form-input"
            type="password"
            required
            placeholder="••••••••"
            autocomplete="current-password"
          />
        </div>

        <button type="submit" id="submitBtn" class="auth-btn">Se connecter</button>
      </form>

      <div class="auth-footer">
        Pas encore de compte ? <a href="/register" class="auth-link">Créer un compte</a>
      </div>
    </div>

    <a href="/" class="back-home"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2Z"/></svg> Retour au chat preview</a>
  </main>

  <script type="module">
    const form = document.getElementById("loginForm");
    const errorBox = document.getElementById("authError");
    const submitBtn = document.getElementById("submitBtn");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorBox.style.display = "none";
      errorBox.textContent = "";
      submitBtn.disabled = true;
      submitBtn.textContent = "Connexion en cours…";

      const identifier = document.getElementById("identifier").value.trim();
      const password = document.getElementById("password").value;

      try {
        const res = await fetch("/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ identifier, password }),
        });
        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.error?.message || "Échec de connexion.");
        }

        // Sauvegarde locale du jeton
        localStorage.setItem("venice_token", data.token);
        localStorage.setItem("venice_user", JSON.stringify(data.user));

        // Redirection vers l'admin si admin, sinon retour au chat ou URL demandée
        const params = new URLSearchParams(window.location.search);
        const redirect = params.get("redirect");

        if (data.isAdmin || data.user?.role === "admin") {
          window.location.href = redirect && redirect !== "/login" ? redirect : "/admin";
        } else {
          window.location.href = redirect && redirect !== "/admin" ? redirect : "/";
        }
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.style.display = "block";
        submitBtn.disabled = false;
        submitBtn.textContent = "Se connecter";
      }
    });
  </script>
</body>
</html>
